name: Release zip

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    name: Build 3d-viewer.zip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3d-viewer
    steps:
      # src/ imports ../bpl-tools, so both repos sit side by side like in wp-content/plugins.
      - uses: actions/checkout@v4
        with:
          path: 3d-viewer

      - uses: actions/checkout@v4
        with:
          repository: bPlugins/bpl-tools
          ref: main
          path: bpl-tools

      - name: Tag must match plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' 3d-viewer.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')
          const=$(grep -oE "define\('BP3D_VERSION', '[^']+'\)" 3d-viewer.php | sed -E "s/.*, '([^']+)'.*/\1/")
          echo "tag=$tag header=$header stable=$stable BP3D_VERSION=$const"
          ok=1
          [ "$header" = "$tag" ] || { echo "::error file=3d-viewer.php::Version header is $header, tag is $tag"; ok=0; }
          [ "$stable" = "$tag" ] || { echo "::error file=readme.txt::Stable tag is $stable, tag is $tag"; ok=0; }
          [ "$const" = "$tag" ] || { echo "::error file=3d-viewer.php::BP3D_VERSION is $const, tag is $tag"; ok=0; }
          [ "$ok" = 1 ]

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, wp-cli

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3d-viewer/package.json

      - name: Composer (production)
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: npm install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Same script as a local release: build, i18n, zip.
      - name: Build zip
        run: |
          mkdir -p languages zip
          npm run build

      - name: Check zip contents
        run: |
          unzip -Z1 zip/3d-viewer.zip > files.txt
          for f in 3d-viewer.php readme.txt uninstall.php vendor/autoload.php vendor/freemius/wordpress-sdk/start.php \
                   vendor/codestar-framework/codestar-framework.php vendor/bp-extension-manager/bootstrap.php \
                   3d-viewer-block/build/block.json build/blocks/3d-viewer/block.json languages/3d-viewer.pot; do
            grep -qxF "$f" files.txt || { echo "::error::$f missing from zip"; exit 1; }
          done
          if grep -E '(^|/)(node_modules|\.git|src|tests)/|\.map$|\.DS_Store$' files.txt; then
            echo "::error::dev files in zip"; exit 1
          fi
          echo "$(wc -l < files.txt) files, $(du -h zip/3d-viewer.zip | cut -f1)"

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^= / { if (f) exit; if (index($0, "= " v " ") == 1 || $0 == "= " v " =") { f = 1; next } }
            f' readme.txt > notes.md
          [ -s notes.md ] || echo "See readme.txt changelog." > notes.md
          gh release create "$GITHUB_REF_NAME" zip/3d-viewer.zip \
            --draft --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      - uses: actions/upload-artifact@v4
        with:
          name: 3d-viewer-${{ github.ref_name }}
          path: 3d-viewer/zip/3d-viewer.zip
